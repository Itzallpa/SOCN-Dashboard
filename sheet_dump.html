<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheet Dump</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="theme.css?v=7" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .log { font-family: ui-monospace, Consolas, monospace; font-size: .82rem; white-space: pre-wrap; background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px; min-height: 120px; }
    .tab-row td { vertical-align: middle; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 980px;">
    <h4 class="fw-bold mb-1">Sheet Dump</h4>
    <p class="text-muted small mb-3">
      อ่านสูตร + ค่าในชีทบริษัทผ่าน Apps Script (เมลบริษัทใน Browser นี้) แล้วเก็บไว้ที่ <code>data/sheet_dumps/</code> ให้ Claude อ่าน logic ได้
    </p>

    <div class="card p-3 mb-3">
      <label class="fw-bold small mb-1" for="sheetUrl">ลิงก์ Google Sheet</label>
      <div class="d-flex gap-2">
        <input id="sheetUrl" class="form-control form-control-sm" value="https://docs.google.com/spreadsheets/d/1b23i0TPw1NHQAoj-D3YeDe4khnXFn_d0MmxfFniuq-k/edit">
        <button class="btn btn-sm btn-dark text-nowrap" onclick="loadTabs()">1) โหลดรายชื่อแท็บ</button>
      </div>
    </div>

    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="fw-bold small">แท็บที่จะส่ง (ติ๊กเลือก · กำหนดจำนวนแถวได้)</div>
        <button class="btn btn-sm btn-primary" id="btnDump" onclick="dumpSelected()" disabled>2) ส่งให้ Claude อ่าน</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm mb-0">
          <thead><tr><th></th><th>แท็บ</th><th class="text-end">แถว</th><th class="text-end">คอลัมน์</th><th class="text-end">เริ่มแถว</th><th class="text-end">จำนวนแถวที่ส่ง</th></tr></thead>
          <tbody id="tabsBody"><tr><td colspan="6" class="text-muted small">กด "โหลดรายชื่อแท็บ" ก่อน</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="log" id="log">พร้อม</div>
  </div>

  <script>
    const WANT = [/productivity/i, /^outbound daily report$/i, /^raw data$/i];
    let cfg = null, info = null;

    const log = (m) => { const el = document.getElementById('log'); el.textContent += '\n' + m; el.scrollTop = el.scrollHeight; };
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const sheetId = () => ((document.getElementById('sheetUrl').value || '').match(/\/d\/([a-zA-Z0-9_-]{20,})/) || [])[1] || '';

    function jsonp(url, params, timeoutMs = 120000) {
      return new Promise((resolve, reject) => {
        const cb = '__dumpCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        const s = document.createElement('script');
        let done = false;
        const finish = () => { done = true; clearTimeout(t); delete window[cb]; s.remove(); };
        const fail = (m) => { if (!done) { finish(); reject(new Error(m)); } };
        const t = setTimeout(() => fail('หมดเวลารอ Apps Script'), timeoutMs);
        window[cb] = (d) => { if (!done) { finish(); resolve(d); } };
        s.onerror = () => fail('เรียก Apps Script ไม่ได้ — login เมลบริษัทใน Browser นี้ก่อน');
        s.onload = () => setTimeout(() => fail('เรียก Apps Script ไม่ได้ — login เมลบริษัทใน Browser นี้ก่อน'), 300);
        s.src = url + (url.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({}, params, { callback: cb, _ts: Date.now() }));
        document.body.appendChild(s);
      });
    }

    async function relay(page, extra) {
      if (!cfg) {
        const r = await (await fetch('/api/lh-trip/drive-settings')).json();
        cfg = { url: r.dailyRelayUrl || (r.settings || {}).sheetRelayUrl, key: r.relayKey };
        if (!cfg.url) throw new Error('ยังไม่ได้ตั้งค่า Apps Script URL');
      }
      const res = await jsonp(cfg.url, Object.assign({ key: cfg.key, page }, extra));
      if (!res || !res.success) {
        const e = (res && res.error) || 'ไม่ทราบสาเหตุ';
        throw new Error(/Unknown page/i.test(e) ? `Apps Script ยังไม่มี page=${page} — วางโค้ดใหม่แล้ว Deploy > Manage deployments > New version` : e);
      }
      return res;
    }

    async function save(dump) {
      const r = await (await fetch('/api/sheet-dump', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dump }) })).json();
      if (!r.success) throw new Error(r.error || 'บันทึกไม่สำเร็จ');
      return r.path;
    }

    async function loadTabs() {
      const id = sheetId();
      if (!id) { log('❌ ลิงก์ไม่ถูกต้อง'); return; }
      log('กำลังโหลดรายชื่อแท็บ...');
      try {
        info = await relay('sheetinfo', { spreadsheetId: id });
        log(`✅ ${info.name}: ${info.sheets.length} แท็บ`);
        await save(info);
        document.getElementById('tabsBody').innerHTML = info.sheets.map((s, i) => {
          const isRaw = /raw/i.test(s.name);
          const on = WANT.some(re => re.test(s.name.replace(/\s+/g, ' ').trim()));
          return `<tr class="tab-row">
            <td><input type="checkbox" class="form-check-input" id="tk${i}" ${on ? 'checked' : ''}></td>
            <td><label for="tk${i}">${esc(s.name)}${s.hidden ? ' <span class="text-muted small">(hidden)</span>' : ''}</label></td>
            <td class="text-end">${s.lastRow.toLocaleString()}</td><td class="text-end">${s.lastCol}</td>
            <td class="text-end"><input type="number" min="1" class="form-control form-control-sm d-inline-block text-end" style="width:90px" id="st${i}" value="1"></td>
            <td class="text-end"><input type="number" min="1" max="2000" class="form-control form-control-sm d-inline-block text-end" style="width:90px" id="nr${i}" value="${isRaw ? 40 : Math.min(Math.max(s.lastRow, 1), 400)}"></td>
          </tr>`;
        }).join('');
        document.getElementById('btnDump').disabled = false;
      } catch (e) { log('❌ ' + e.message); }
    }

    async function dumpSelected() {
      if (!info) return;
      const btn = document.getElementById('btnDump'); btn.disabled = true;
      for (let i = 0; i < info.sheets.length; i++) {
        if (!document.getElementById('tk' + i).checked) continue;
        const s = info.sheets[i];
        const startRow = document.getElementById('st' + i).value || 1;
        const maxRows = document.getElementById('nr' + i).value || 200;
        log(`กำลังอ่าน "${s.name}" แถว ${startRow} (${maxRows} แถว)...`);
        try {
          const d = await relay('dump', { spreadsheetId: info.spreadsheetId, sheetName: s.name, startRow, maxRows, maxCols: 80 });
          const path = await save(d);
          log(`  ✅ ${d.rows} แถว × ${d.cols} คอลัมน์ · สูตร ${d.formulas.length} ช่อง → ${path}`);
        } catch (e) { log(`  ❌ ${e.message}`); }
      }
      log('เสร็จแล้ว — บอก Claude ได้เลย');
      btn.disabled = false;
    }
  </script>
</body>
</html>
