<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SOC Operations Control Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1e293b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
    }
    .login-header {
      background: #0d1b2a;
      color: #ffffff;
      padding: 32px 28px;
      text-align: center;
    }
    .login-header .brand-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    .login-header h4 {
      font-weight: 800;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0;
    }
    .login-body {
      padding: 32px 28px;
    }
    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .role-option {
      flex: 1;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-option:hover {
      border-color: #2563eb;
      background: #f8fafc;
    }
    .role-option input[type="radio"] {
      display: none;
    }
    .role-option.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .role-option.selected.admin-selected {
      border-color: #d0311d;
      background: #fef2f2;
    }
    .role-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: #0f172a;
    }
    .role-sub {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }
    .btn-google {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-weight: 700;
      padding: 12px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-size: 0.78rem;
      margin: 20px 0;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider-text span {
      padding: 0 10px;
    }
    .security-notice {
      font-size: 0.76rem;
      color: #64748b;
      text-align: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">📦</div>
      <h4>SOC Operations Portal</h4>
      <p>Control Center Authentication & Access Control</p>
    </div>

    <div class="login-body">
      <div id="loginAlert" class="mb-3" style="display:none;"></div>

      <label class="form-label fw-bold small text-secondary mb-2">1. เลือกเลเวลสิทธิ์ผู้ใช้งาน (Select User Role):</label>
      <div class="role-selector mb-3">
        <div class="role-option selected" id="roleGroundOpt" onclick="selectRole('Ground')">
          <input type="radio" name="userRole" value="Ground" checked>
          <div class="role-title"><i class="fa-solid fa-user me-1 text-primary"></i> Ground</div>
          <div class="role-sub">เจ้าหน้าที่ปฏิบัติการ</div>
        </div>
        <div class="role-option" id="roleAdminOpt" onclick="selectRole('Admin')">
          <input type="radio" name="userRole" value="Admin">
          <div class="role-title"><i class="fa-solid fa-shield-halved me-1 text-danger"></i> Admin</div>
          <div class="role-sub">ผู้ดูแลระบบ & Audit Logs</div>
        </div>
      </div>

      <label class="form-label fw-bold small text-secondary mb-2">2. เข้าสู่ระบบด้วย Google / Gmail (Sign in with Gmail):</label>

      <!-- Google Sign-In Official GIS Button -->
      <div id="g_id_onload"
           data-client_id="1084209184512-mockclientid.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleGoogleSignInResponse"
           data-auto_prompt="false">
      </div>
      
      <form id="emailLoginForm" onsubmit="handleEmailLogin(event)">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-secondary"></i></span>
            <input type="email" id="gmailInput" class="form-control" placeholder="your.name@spxexpress.com หรือ gmail.com" required>
          </div>
        </div>
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-secondary"></i></span>
            <input type="text" id="nameInput" class="form-control" placeholder="ชื่อ-นามสกุล (ผู้ใช้งาน)">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2"><i class="fa-brands fa-google me-2"></i> เข้าสู่ระบบด้วย Google Account / Gmail</button>
      </form>

      <div class="security-notice">
        <i class="fa-solid fa-lock me-1"></i> ระบบจะตัดการเชื่อมต่ออัตโนมัติหากไม่มีการใช้งานเกิน 1 ชั่วโมง (1-Hour Idle Timeout)
      </div>
    </div>
  </div>

  <script src="auth_guard.js"></script>
  <script>
    let selectedRole = 'Ground';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-option').forEach(el => el.classList.remove('selected', 'admin-selected'));
      if (role === 'Ground') {
        document.getElementById('roleGroundOpt').classList.add('selected');
      } else {
        document.getElementById('roleAdminOpt').classList.add('selected', 'admin-selected');
      }
    }

    function showAlert(msg, type = 'danger') {
      const el = document.getElementById('loginAlert');
      el.className = `alert alert-${type} py-2 px-3 small`;
      el.innerText = msg;
      el.style.display = 'block';
    }

    function handleEmailLogin(evt) {
      if (evt) evt.preventDefault();
      const email = document.getElementById('gmailInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();

      if (!email) {
        showAlert('กรุณากรอกอีเมล Google / Gmail');
        return;
      }

      submitLogin(email, name, selectedRole);
    }

    function handleGoogleSignInResponse(response) {
      if (response && response.credential) {
        // Decode JWT payload locally
        try {
          const base64Url = response.credential.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
          const payload = JSON.parse(jsonPayload);

          submitLogin(payload.email, payload.name, selectedRole, payload.picture);
        } catch (e) {
          showAlert('เกิดข้อผิดพลาดในการอ่านข้อมูล Google Account');
        }
      }
    }

    function submitLogin(email, name, role, picture) {
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          name: name || email.split('@')[0].replace('.', ' ').toUpperCase(),
          role: role,
          picture: picture
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.AuthGuard.saveUser(data.user, true);
          showAlert(`✅ เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ ${data.user.name} (Role: ${data.user.role})`, 'success');
          setTimeout(() => {
            window.location.href = "index.html";
          }, 600);
        } else {
          showAlert(data.error || 'ไม่สามารถเข้าสู่ระบบได้');
        }
      })
      .catch(err => {
        // Local fallback if server API is unavailable
        const userObj = {
          email: email,
          name: name || email.split('@')[0].toUpperCase(),
          role: role,
          picture: picture || `https://ui-avatars.com/api/?name=${encodeURIComponent(name || email)}&background=0d1b2a&color=fff`
        };
        window.AuthGuard.saveUser(userObj, true);
        window.location.href = "index.html";
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const existingUser = window.AuthGuard.getUser();
      if (existingUser) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
